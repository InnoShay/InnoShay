name: Charts and cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/projects.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hand-authored skill radar (edit assets/skills.json to change it)
      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      # Language radar built from hardcoded skills to guarantee a perfect hexagon
      - name: Language radar
        run: |
          python scripts/radar.py \
            --data assets/languages.json \
            -o assets/radar-langs

      # Self-hosted stat and repo cards. These replace github-readme-stats and
      # github-profile-trophy, whose shared public instances return 503 and 402.
      # METRICS_TOKEN is a PAT and can read the contribution graph; the built-in
      # GITHUB_TOKEN is the fallback and just means fewer tiles.
      - name: Generate aesthetic cards and metrics
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user InnoShay \
            --projects assets/projects.json \
            --out assets
          python scripts/activity_gen.py

      - name: Fetch Streak Stats
        run: |
          curl -s -o assets/streak.svg "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=00000000&ring=DD8A53&fire=DD8A53&currStreakNum=ffffff&currStreakLabel=DD8A53&sideNums=ffffff&sideLabels=8b949e&dates=8b949e"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/card-*.svg assets/streak.svg assets/activity.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts and cards"
          git push
