<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" fill="none">
  <rect width="900" height="200" fill="#FAFAFA"/>

  <!-- Base timeline axis -->
  <line x1="60" y1="120" x2="840" y2="120" stroke="#E4E4E7" stroke-width="1"/>

  <!-- ======================= 2024: FOUNDATIONS ======================= -->
  <text x="60" y="150" fill="#71717A" font-family="'SF Mono', monospace" font-size="10">2024</text>
  <text x="60" y="165" fill="#3F3F46" font-family="'Inter', sans-serif" font-size="11" font-weight="600">DEEP LEARNING &amp; CS</text>
  
  <g transform="translate(60, 120)">
    <!-- Low density activity -->
    <line x1="10" y1="0" x2="10" y2="-15" stroke="#D4D4D8" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="-10" stroke="#D4D4D8" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="-20" stroke="#D4D4D8" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="-12" stroke="#D4D4D8" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="-25" stroke="#A1A1AA" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="-15" stroke="#D4D4D8" stroke-width="2"/>
  </g>

  <!-- ======================= 2025: EXPLORATION & HACKATHONS ======================= -->
  <text x="300" y="150" fill="#71717A" font-family="'SF Mono', monospace" font-size="10">2025</text>
  <text x="300" y="165" fill="#3F3F46" font-family="'Inter', sans-serif" font-size="11" font-weight="600">10+ HACKATHONS &amp; APPLIED NLP</text>
  
  <g transform="translate(300, 120)">
    <!-- Medium/high density activity -->
    <line x1="10" y1="0" x2="10" y2="-30" stroke="#A1A1AA" stroke-width="2"/>
    <line x1="25" y1="0" x2="25" y2="-40" stroke="#71717A" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="-25" stroke="#A1A1AA" stroke-width="2"/>
    <line x1="55" y1="0" x2="55" y2="-50" stroke="#52525B" stroke-width="2"/>
    <line x1="75" y1="0" x2="75" y2="-35" stroke="#71717A" stroke-width="2"/>
    <line x1="90" y1="0" x2="90" y2="-45" stroke="#52525B" stroke-width="2"/>
    
    <line x1="110" y1="0" x2="110" y2="-60" stroke="#18181B" stroke-width="2"/> <!-- Hackathon win -->
    <circle cx="110" cy="-65" r="2" fill="#D97706"/>
    <text x="115" y="-70" fill="#D97706" font-family="'SF Mono', monospace" font-size="8">IBM WINNER</text>

    <line x1="130" y1="0" x2="130" y2="-30" stroke="#A1A1AA" stroke-width="2"/>
    <line x1="145" y1="0" x2="145" y2="-55" stroke="#52525B" stroke-width="2"/>
    
    <line x1="170" y1="0" x2="170" y2="-65" stroke="#18181B" stroke-width="2"/> <!-- Startup win -->
    <circle cx="170" cy="-70" r="2" fill="#D97706"/>
    <text x="175" y="-75" fill="#D97706" font-family="'SF Mono', monospace" font-size="8">STARTUP CHALLENGE</text>
    
    <line x1="190" y1="0" x2="190" y2="-40" stroke="#71717A" stroke-width="2"/>
    <line x1="210" y1="0" x2="210" y2="-35" stroke="#A1A1AA" stroke-width="2"/>
  </g>

  <!-- ======================= 2026: PRODUCTION ======================= -->
  <text x="600" y="150" fill="#D97706" font-family="'SF Mono', monospace" font-size="10">2026 (CURRENT)</text>
  <text x="600" y="165" fill="#18181B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">AGENTIC SYSTEMS &amp; INNOSHAY</text>
  
  <g transform="translate(600, 120)">
    <!-- Very high, consistent density (building products) -->
    <rect x="10" y="-45" width="230" height="45" fill="#FEF3C7"/> <!-- Solid block representing deep work -->
    <line x1="10" y1="0" x2="10" y2="-45" stroke="#D97706" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="-55" stroke="#D97706" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="-50" stroke="#D97706" stroke-width="2"/>
    <line x1="70" y1="0" x2="70" y2="-60" stroke="#D97706" stroke-width="2"/>
    <line x1="90" y1="0" x2="90" y2="-55" stroke="#D97706" stroke-width="2"/>
    <line x1="110" y1="0" x2="110" y2="-65" stroke="#D97706" stroke-width="2"/>
    <line x1="130" y1="0" x2="130" y2="-60" stroke="#D97706" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="-70" stroke="#D97706" stroke-width="2"/>
    <line x1="170" y1="0" x2="170" y2="-65" stroke="#D97706" stroke-width="2"/>
    <line x1="190" y1="0" x2="190" y2="-75" stroke="#D97706" stroke-width="2"/>
    <line x1="210" y1="0" x2="210" y2="-70" stroke="#D97706" stroke-width="2"/>
    <line x1="230" y1="0" x2="230" y2="-80" stroke="#D97706" stroke-width="2"/>
    
    <!-- Pulse point at the end -->
    <circle cx="230" cy="-80" r="4" fill="#D97706" opacity="0.9"/>
    <circle cx="230" cy="-80" r="8" fill="none" stroke="#D97706" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Overlay text to replace stats -->
  <text x="60" y="40" fill="#71717A" font-family="'SF Mono', monospace" font-size="10" letter-spacing="1">MOMENTUM &amp; SHIPPING RHYTHM</text>

</svg>
