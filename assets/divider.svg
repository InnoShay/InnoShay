<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 8" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background track -->
  <rect width="800" height="1" y="3.5" fill="#1E293B"/>
  
  <!-- Glowing center -->
  <rect width="400" height="1.5" x="200" y="3.25" fill="url(#divGrad)"/>
  
  <!-- Animated traveling particle -->
  <circle r="2" cy="4" fill="#0EA5E9" filter="url(#glow)">
    <animate attributeName="cx" values="-10;810" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="1" cy="4" fill="#FFFFFF">
    <animate attributeName="cx" values="-10;810" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
