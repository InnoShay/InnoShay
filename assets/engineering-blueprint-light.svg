<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <defs>
    <!-- Blueprint Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E4E4E7" stroke-width="0.5" opacity="0.8"/>
    </pattern>
    <pattern id="grid-dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#A1A1AA"/>
    </pattern>
  </defs>

  <rect width="900" height="400" fill="#FAFAFA"/>
  <rect width="900" height="400" fill="url(#grid)"/>
  
  <!-- Architectural Layout Lines -->
  <line x1="0" y1="350" x2="900" y2="350" stroke="#D4D4D8" stroke-width="1"/>
  <line x1="0" y1="50" x2="900" y2="50" stroke="#D4D4D8" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="400" stroke="#D4D4D8" stroke-width="1"/>

  <!-- Title / Legend -->
  <text x="30" y="30" fill="#18181B" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE .01</text>
  <text x="30" y="380" fill="#71717A" font-family="'SF Mono', monospace" font-size="10">FIG. 1: END-TO-END APPLIED AI PIPELINE (AS USED IN GENESIS &amp; HIRESIGHT)</text>

  <!-- ======================= PIPELINE MODULES ======================= -->

  <!-- Module 1: Ingestion -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="180" height="160" fill="url(#grid-dots)" stroke="#A1A1AA" stroke-width="1"/>
    <rect x="0" y="0" width="180" height="30" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="1"/>
    <text x="10" y="20" fill="#3F3F46" font-family="'SF Mono', monospace" font-size="11">01. INGESTION</text>
    
    <text x="10" y="60" fill="#71717A" font-family="'SF Mono', monospace" font-size="9">INPUT STREAMS</text>
    <!-- Elements -->
    <rect x="10" y="75" width="160" height="24" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
    <text x="90" y="91" fill="#3F3F46" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">UNSTRUCTURED DATA</text>
    
    <rect x="10" y="105" width="160" height="24" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
    <text x="90" y="121" fill="#3F3F46" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">NLP PRE-PROCESSING</text>
  </g>

  <!-- Flow Line 1 -->
  <path d="M 240 200 L 300 200" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="300,200 294,196 294,204" fill="#D97706"/>

  <!-- Module 2: Agentic Reasoning -->
  <g transform="translate(320, 90)">
    <rect x="0" y="0" width="220" height="220" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" fill="#D97706" stroke="#D97706" stroke-width="1"/>
    <text x="10" y="20" fill="#FFFFFF" font-family="'SF Mono', monospace" font-size="11" font-weight="700">02. AGENTIC ORCHESTRATION</text>
    
    <!-- Sub-modules -->
    <rect x="20" y="50" width="180" height="40" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
    <text x="110" y="70" fill="#18181B" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">LLM REASONING CORE</text>
    <text x="110" y="82" fill="#71717A" font-family="'SF Mono', monospace" font-size="8" text-anchor="middle">LANGCHAIN / HUGGINGFACE</text>

    <!-- Vector DB -->
    <path d="M 110 110 L 170 110 L 190 140 L 130 140 Z" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
    <text x="150" y="128" fill="#52525B" font-family="'SF Mono', monospace" font-size="8" text-anchor="middle">VECTOR DB</text>
    
    <path d="M 30 110 L 90 110 L 110 140 L 50 140 Z" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
    <text x="70" y="128" fill="#52525B" font-family="'SF Mono', monospace" font-size="8" text-anchor="middle">RAG INDEX</text>

    <!-- Output Structuring -->
    <rect x="20" y="160" width="180" height="30" fill="#FAFAFA" stroke="#D97706" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="110" y="179" fill="#D97706" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">STRUCTURED GENERATION</text>
  </g>

  <!-- Flow Line 2 -->
  <path d="M 540 200 L 600 200" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="600,200 594,196 594,204" fill="#D97706"/>

  <!-- Module 3: Deployment -->
  <g transform="translate(620, 120)">
    <rect x="0" y="0" width="180" height="160" fill="url(#grid-dots)" stroke="#A1A1AA" stroke-width="1"/>
    <rect x="0" y="0" width="180" height="30" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="1"/>
    <text x="10" y="20" fill="#3F3F46" font-family="'SF Mono', monospace" font-size="11">03. PRODUCTIZATION</text>
    
    <!-- Backend -->
    <rect x="10" y="55" width="160" height="40" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <text x="90" y="75" fill="#18181B" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">FASTAPI BACKEND</text>
    <text x="90" y="87" fill="#71717A" font-family="'SF Mono', monospace" font-size="8" text-anchor="middle">SCALABLE MICROSERVICES</text>

    <!-- Frontend -->
    <rect x="10" y="105" width="160" height="40" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <text x="90" y="125" fill="#18181B" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle">REACT INTERFACE</text>
    <text x="90" y="137" fill="#71717A" font-family="'SF Mono', monospace" font-size="8" text-anchor="middle">UX / DATA VISUALIZATION</text>
  </g>

  <!-- Vertical Measurements -->
  <line x1="815" y1="120" x2="815" y2="280" stroke="#71717A" stroke-width="0.5"/>
  <line x1="812" y1="120" x2="818" y2="120" stroke="#71717A" stroke-width="0.5"/>
  <line x1="812" y1="280" x2="818" y2="280" stroke="#71717A" stroke-width="0.5"/>
  <text x="825" y="205" fill="#71717A" font-family="'SF Mono', monospace" font-size="9" transform="rotate(-90 825,205)">PRODUCTION</text>

</svg>
