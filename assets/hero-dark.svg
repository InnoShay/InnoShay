<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" fill="none">
  <defs>
    <!-- Rich gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="40%" stop-color="#0f1729"/>
      <stop offset="70%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#0d1321"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.1" r="0.4">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#C9D1D9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillBorder1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="pillBorder2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f35" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#151929" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Particle paths -->
    <path id="path1" d="M-20,100 C200,80 400,140 920,90" fill="none"/>
    <path id="path2" d="M-20,250 C150,230 500,280 920,220" fill="none"/>
    <path id="path3" d="M-20,350 C300,330 600,380 920,340" fill="none"/>
    <path id="path4" d="M920,60 C700,100 300,50 -20,120" fill="none"/>
    <path id="path5" d="M920,400 C600,370 200,420 -20,380" fill="none"/>
    <path id="pathDiag1" d="M-20,450 C200,350 500,200 920,50" fill="none"/>
    <path id="pathDiag2" d="M-20,0 C300,150 600,300 920,450" fill="none"/>
  </defs>

  <!-- ===== BACKGROUND LAYERS ===== -->
  <rect width="900" height="450" fill="url(#bg)"/>
  <rect width="900" height="450" fill="url(#glow1)"/>
  <rect width="900" height="450" fill="url(#glow2)"/>
  <rect width="900" height="450" fill="url(#glow3)"/>

  <!-- Subtle grid -->
  <g opacity="0.035">
    <line x1="0" y1="75" x2="900" y2="75" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="900" y2="150" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="0" y1="225" x2="900" y2="225" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="0" y1="375" x2="900" y2="375" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="450" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="450" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="450" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#7C8DB5" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="450" stroke="#7C8DB5" stroke-width="0.5"/>
  </g>

  <!-- ===== SCANNING LINE ===== -->
  <rect width="900" height="80" fill="url(#scanGrad)" y="0">
    <animateTransform attributeName="transform" type="translate" values="0,-80;0,450;0,-80" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== FLOWING PARTICLE STREAMS ===== -->
  <!-- Stream 1 - cyan particles -->
  <circle r="2" fill="#00D4FF" opacity="0.7" filter="url(#nodeGlow)">
    <animateMotion dur="12s" repeatCount="indefinite"><mpath href="#path1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#00D4FF" opacity="0.5" filter="url(#nodeGlow)">
    <animateMotion dur="12s" repeatCount="indefinite" begin="4s"><mpath href="#path1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="12s" repeatCount="indefinite" begin="4s"/>
  </circle>
  <circle r="1" fill="#00D4FF" opacity="0.4">
    <animateMotion dur="12s" repeatCount="indefinite" begin="8s"><mpath href="#path1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="12s" repeatCount="indefinite" begin="8s"/>
  </circle>

  <!-- Stream 2 - purple particles -->
  <circle r="2" fill="#A855F7" opacity="0.6" filter="url(#nodeGlow)">
    <animateMotion dur="15s" repeatCount="indefinite"><mpath href="#path2"/></animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#A855F7" opacity="0.4" filter="url(#nodeGlow)">
    <animateMotion dur="15s" repeatCount="indefinite" begin="5s"><mpath href="#path2"/></animateMotion>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="15s" repeatCount="indefinite" begin="5s"/>
  </circle>
  <circle r="1" fill="#7C3AED" opacity="0.3">
    <animateMotion dur="15s" repeatCount="indefinite" begin="10s"><mpath href="#path2"/></animateMotion>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="15s" repeatCount="indefinite" begin="10s"/>
  </circle>

  <!-- Stream 3 - blue particles -->
  <circle r="1.5" fill="#3B82F6" opacity="0.5" filter="url(#nodeGlow)">
    <animateMotion dur="18s" repeatCount="indefinite"><mpath href="#path3"/></animateMotion>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="1" fill="#3B82F6" opacity="0.3">
    <animateMotion dur="18s" repeatCount="indefinite" begin="6s"><mpath href="#path3"/></animateMotion>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="18s" repeatCount="indefinite" begin="6s"/>
  </circle>

  <!-- Reverse streams -->
  <circle r="1.5" fill="#00D4FF" opacity="0.4" filter="url(#nodeGlow)">
    <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#path4"/></animateMotion>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle r="1" fill="#A855F7" opacity="0.3">
    <animateMotion dur="16s" repeatCount="indefinite"><mpath href="#path5"/></animateMotion>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- Diagonal streams -->
  <circle r="2" fill="#00D4FF" opacity="0.3" filter="url(#nodeGlow)">
    <animateMotion dur="20s" repeatCount="indefinite"><mpath href="#pathDiag1"/></animateMotion>
    <animate attributeName="opacity" values="0;0.4;0.4;0" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#7C3AED" opacity="0.25">
    <animateMotion dur="22s" repeatCount="indefinite"><mpath href="#pathDiag2"/></animateMotion>
    <animate attributeName="opacity" values="0;0.35;0.35;0" dur="22s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== NEURAL NETWORK NODES ===== -->
  <!-- Top right cluster -->
  <g filter="url(#nodeGlow)">
    <circle cx="720" cy="55" r="3.5" fill="#00D4FF" opacity="0.6">
      <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="40" r="2.5" fill="#A855F7" opacity="0.5">
      <animate attributeName="r" values="2;4;2" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="70" r="3" fill="#3B82F6" opacity="0.5">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="90" r="2" fill="#00D4FF" opacity="0.4">
      <animate attributeName="r" values="1.5;3;1.5" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="35" r="2" fill="#7C3AED" opacity="0.3">
      <animate attributeName="r" values="1.5;3;1.5" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Node connections -->
    <line x1="720" y1="55" x2="780" y2="40" stroke="#00D4FF" stroke-width="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="780" y1="40" x2="840" y2="70" stroke="#A855F7" stroke-width="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="840" y1="70" x2="760" y2="90" stroke="#3B82F6" stroke-width="0.8" opacity="0.15">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="720" y1="55" x2="760" y2="90" stroke="#00D4FF" stroke-width="0.5" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="780" y1="40" x2="870" y2="35" stroke="#7C3AED" stroke-width="0.5" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Bottom left cluster -->
  <g filter="url(#nodeGlow)">
    <circle cx="50" cy="380" r="3" fill="#A855F7" opacity="0.5">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="400" r="2.5" fill="#00D4FF" opacity="0.4">
      <animate attributeName="r" values="2;3.5;2" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="420" r="2" fill="#3B82F6" opacity="0.3">
      <animate attributeName="r" values="1.5;3;1.5" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="370" r="1.5" fill="#7C3AED" opacity="0.3">
      <animate attributeName="r" values="1;2.5;1" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="50" y1="380" x2="100" y2="400" stroke="#A855F7" stroke-width="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="400" x2="35" y2="420" stroke="#00D4FF" stroke-width="0.5" opacity="0.15">
      <animate attributeName="opacity" values="0.05;0.25;0.05" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="380" x2="120" y2="370" stroke="#7C3AED" stroke-width="0.5" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="3.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Mid-right floating nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="850" cy="200" r="2" fill="#00D4FF" opacity="0.3">
      <animate attributeName="r" values="1.5;3;1.5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="270" r="1.5" fill="#A855F7" opacity="0.25">
      <animate attributeName="r" values="1;2.5;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/>
    </circle>
    <line x1="850" y1="200" x2="820" y2="270" stroke="#00D4FF" stroke-width="0.5" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== ANIMATED ACCENT LINE (top) ===== -->
  <rect x="55" y="62" width="60" height="2.5" rx="1.25" fill="url(#accentLine)">
    <animate attributeName="width" values="40;80;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== SYSTEM LABEL ===== -->
  <text x="55" y="55" fill="#00D4FF" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="4" opacity="0.8">
    NEURAL.ARCHITECT
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- ===== MAIN NAME WITH GLOW ===== -->
  <!-- Glow layer -->
  <text x="55" y="145" fill="#7C3AED" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="70" font-weight="900" letter-spacing="-2" opacity="0.15" filter="url(#textGlow)">LAKSHAY</text>
  <text x="55" y="220" fill="#00D4FF" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="70" font-weight="900" letter-spacing="-2" opacity="0.12" filter="url(#textGlow)">SHARMA</text>
  <!-- Main text -->
  <text x="55" y="145" fill="url(#nameGrad)" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="70" font-weight="900" letter-spacing="-2">LAKSHAY</text>
  <text x="55" y="220" fill="url(#nameGrad)" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="70" font-weight="900" letter-spacing="-2">SHARMA</text>

  <!-- Animated accent bar -->
  <rect x="37" y="90" width="3.5" height="140" rx="1.75" fill="url(#accentLine)">
    <animate attributeName="height" values="130;150;130" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== POSITIONING LINE ===== -->
  <text x="58" y="260" fill="#7C8DB5" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="13.5" letter-spacing="0.5">AI engineer building intelligent systems that</text>
  <text x="58" y="282" fill="#7C8DB5" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="13.5" letter-spacing="0.5">ship to production.</text>

  <!-- ===== PILL TAGS ===== -->
  <g transform="translate(55, 310)">
    <!-- IIT Madras -->
    <rect x="0" y="0" width="110" height="30" rx="8" fill="url(#pillFill)" stroke="url(#pillBorder1)" stroke-width="1.2"/>
    <text x="55" y="20" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono',monospace" font-size="11" font-weight="500">IIT Madras</text>

    <!-- Founder, InnoShay -->
    <rect x="122" y="0" width="142" height="30" rx="8" fill="url(#pillFill)" stroke="url(#pillBorder1)" stroke-width="1.2"/>
    <text x="193" y="20" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono',monospace" font-size="11" font-weight="500">Founder, InnoShay</text>

    <!-- LLMs · Agentic AI (highlight) -->
    <rect x="276" y="0" width="138" height="30" rx="8" fill="url(#pillFill)" stroke="url(#pillBorder2)" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="345" y="20" text-anchor="middle" fill="#00D4FF" font-family="'SF Mono',monospace" font-size="11" font-weight="600">LLMs · Agentic AI</text>

    <!-- 2 Products Live -->
    <rect x="426" y="0" width="148" height="30" rx="8" fill="url(#pillFill)" stroke="url(#pillBorder1)" stroke-width="1.2"/>
    <text x="492" y="20" text-anchor="middle" fill="#C9D1D9" font-family="'SF Mono',monospace" font-size="11" font-weight="500">2 Products Live</text>
    <circle cx="556" cy="15" r="4" fill="#22C55E" opacity="0.9">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== BOTTOM ACCENT LINE ===== -->
  <rect x="55" y="370" width="790" height="1" fill="#1e2a3a"/>
  <!-- Animated gradient bar -->
  <rect x="55" y="369" width="150" height="2.5" rx="1.25" fill="url(#accentLine)" opacity="0.7">
    <animate attributeName="width" values="100;200;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== STATUS INDICATOR ===== -->
  <g transform="translate(730, 390)">
    <circle cx="0" cy="10" r="4" fill="#22C55E" opacity="0.8" filter="url(#nodeGlow)">
      <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="14" fill="#22C55E" font-family="'SF Mono',monospace" font-size="11" font-weight="600" opacity="0.8">
      BUILDING
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Version tag -->
  <text x="55" y="400" fill="#3a4560" font-family="'SF Mono',monospace" font-size="9" letter-spacing="2">v2.0 // 2026</text>

  <!-- ===== CORNER ACCENTS ===== -->
  <g opacity="0.3">
    <path d="M 0 25 L 0 0 L 25 0" stroke="url(#accentLine)" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 875 0 L 900 0 L 900 25" stroke="url(#accentLine)" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 425 L 0 450 L 25 450" stroke="url(#accentLine)" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 875 450 L 900 450 L 900 425" stroke="url(#accentLine)" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
