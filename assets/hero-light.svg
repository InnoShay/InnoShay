<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <defs>
    <linearGradient id="bg-l" x1="0" y1="0" x2="900" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F8FA"/>
    </linearGradient>
    <linearGradient id="accent-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0969DA"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="textGrad-l" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F2328"/>
      <stop offset="60%" stop-color="#1F2328"/>
      <stop offset="100%" stop-color="#656D76"/>
    </linearGradient>
    <filter id="glow-l">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bg-l)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="80" x2="900" y2="80" stroke="#0969DA" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#0969DA" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#0969DA" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="900" y2="320" stroke="#0969DA" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="400" stroke="#0969DA" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="400" stroke="#0969DA" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="400" stroke="#0969DA" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="400" stroke="#0969DA" stroke-width="0.5"/>
  </g>

  <!-- Circuit node pattern - top right -->
  <g opacity="0.15" filter="url(#glow-l)">
    <circle cx="780" cy="60" r="3" fill="#0969DA">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="45" r="2" fill="#0969DA">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="80" r="2.5" fill="#0969DA">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <line x1="780" y1="60" x2="820" y2="45" stroke="#0969DA" stroke-width="0.5" opacity="0.5"/>
    <line x1="820" y1="45" x2="850" y2="80" stroke="#0969DA" stroke-width="0.5" opacity="0.5"/>
    <line x1="850" y1="80" x2="780" y2="60" stroke="#0969DA" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Circuit node pattern - bottom left -->
  <g opacity="0.12" filter="url(#glow-l)">
    <circle cx="60" cy="340" r="2.5" fill="#0969DA">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="360" r="2" fill="#0969DA">
      <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="370" r="1.5" fill="#0969DA">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <line x1="60" y1="340" x2="100" y2="360" stroke="#0969DA" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="360" x2="45" y2="370" stroke="#0969DA" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Top accent line -->
  <rect x="60" y="55" width="40" height="2" fill="url(#accent-l)" rx="1">
    <animate attributeName="width" values="40;55;40" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- System label -->
  <text x="60" y="50" fill="#0969DA" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10" letter-spacing="3" opacity="0.6">SYSTEMS.ARCHITECT</text>

  <!-- Main name -->
  <text x="60" y="130" fill="url(#textGrad-l)" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">LAKSHAY</text>
  <text x="60" y="195" fill="url(#textGrad-l)" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">SHARMA</text>

  <!-- Accent bar next to name -->
  <rect x="42" y="85" width="3" height="120" fill="url(#accent-l)" rx="1.5"/>

  <!-- Positioning line -->
  <text x="60" y="235" fill="#656D76" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="0.5">AI engineer building intelligent systems that</text>
  <text x="60" y="255" fill="#656D76" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="0.5">ship to production.</text>

  <!-- Metadata tags -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="100" height="24" rx="4" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text x="50" y="16" text-anchor="middle" fill="#656D76" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="10">IIT Madras</text>

    <rect x="112" y="0" width="120" height="24" rx="4" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text x="172" y="16" text-anchor="middle" fill="#656D76" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="10">Founder, InnoShay</text>

    <rect x="244" y="0" width="120" height="24" rx="4" fill="#DBEAFE" stroke="#0969DA" stroke-width="1" opacity="0.8"/>
    <text x="304" y="16" text-anchor="middle" fill="#0969DA" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="10">LLMs · Agentic AI</text>

    <rect x="376" y="0" width="130" height="24" rx="4" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text x="441" y="16" text-anchor="middle" fill="#656D76" font-family="'SF Mono', 'Cascadia Code', monospace" font-size="10">2 Products Live ●</text>
    <circle cx="496" cy="12" r="3" fill="#1A7F37" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom accent line -->
  <rect x="60" y="340" width="780" height="1" fill="#D0D7DE"/>
  <rect x="60" y="340" width="120" height="1" fill="url(#accent-l)" opacity="0.6"/>

  <!-- Status indicator bottom right -->
  <g transform="translate(750, 355)">
    <circle cx="0" cy="8" r="3" fill="#1A7F37" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="12" fill="#1A7F37" font-family="'SF Mono', monospace" font-size="10" opacity="0.6">BUILDING</text>
  </g>

  <!-- Corner accents -->
  <path d="M 0 20 L 0 0 L 20 0" stroke="#D0D7DE" stroke-width="1.5" fill="none"/>
  <path d="M 880 0 L 900 0 L 900 20" stroke="#D0D7DE" stroke-width="1.5" fill="none"/>
  <path d="M 0 380 L 0 400 L 20 400" stroke="#D0D7DE" stroke-width="1.5" fill="none"/>
  <path d="M 880 400 L 900 400 L 900 380" stroke="#D0D7DE" stroke-width="1.5" fill="none"/>
</svg>
