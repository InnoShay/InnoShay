<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" fill="none">
  <defs>
    <!-- Background is transparent to blend with GitHub profile -->
    <linearGradient id="conn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="beGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="feGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="toolsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.8"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============ CONNECTION LINES ============ -->
  <g stroke="url(#conn)" stroke-width="1.5" opacity="0.6">
    <!-- Center (450, 225) to AI (top) -->
    <line x1="450" y1="225" x2="250" y2="100"/>
    <line x1="450" y1="225" x2="450" y2="70"/>
    <line x1="450" y1="225" x2="650" y2="100"/>
    <!-- Center to Backend (left) -->
    <line x1="450" y1="225" x2="180" y2="200"/>
    <line x1="450" y1="225" x2="180" y2="270"/>
    <!-- Center to Frontend (right) -->
    <line x1="450" y1="225" x2="720" y2="200"/>
    <line x1="450" y1="225" x2="720" y2="270"/>
    <!-- Center to Data (bottom left) -->
    <line x1="450" y1="225" x2="300" y2="380"/>
    <line x1="450" y1="225" x2="450" y2="390"/>
    <!-- Center to Tools (bottom right) -->
    <line x1="450" y1="225" x2="600" y2="380"/>
    
    <!-- Secondary Connections -->
    <line x1="250" y1="100" x2="450" y2="70" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="450" y1="70" x2="650" y2="100" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="300" y1="380" x2="450" y2="390" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="450" y1="390" x2="600" y2="380" stroke-dasharray="4,4" opacity="0.4"/>
  </g>

  <!-- ============ DATA PACKETS (ANIMATED) ============ -->
  <g filter="url(#glow)">
    <!-- To LLMs -->
    <circle r="3" fill="#8B5CF6">
      <animateMotion dur="3s" repeatCount="indefinite" path="M450,225 L250,100"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- To RAG -->
    <circle r="3" fill="#8B5CF6">
      <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.5s" path="M450,225 L450,70"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <!-- To LangChain -->
    <circle r="3" fill="#8B5CF6">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="1s" path="M450,225 L650,100"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <!-- To FastAPI -->
    <circle r="3" fill="#10B981">
      <animateMotion dur="2s" repeatCount="indefinite" begin="0.2s" path="M450,225 L180,200"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <!-- To React -->
    <circle r="3" fill="#F59E0B">
      <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.7s" path="M450,225 L720,200"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <!-- To PostgreSQL -->
    <circle r="3" fill="#0EA5E9">
      <animateMotion dur="3s" repeatCount="indefinite" begin="1.2s" path="M450,225 L300,380"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
  </g>

  <!-- ============ CORE NODE ============ -->
  <g transform="translate(450, 225)">
    <!-- Pulsing aura -->
    <circle r="40" fill="none" stroke="#0EA5E9" stroke-width="2" opacity="0.4" filter="url(#strongGlow)">
      <animate attributeName="r" values="35;55;35" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="45" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.2">
      <animate attributeName="r" values="45;65;45" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Solid core -->
    <circle r="32" fill="#0F172A" stroke="#0EA5E9" stroke-width="2"/>
    <text y="4" text-anchor="middle" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">BUILD</text>
  </g>

  <!-- ============ AI / ML CLUSTER ============ -->
  <g transform="translate(250, 100)">
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0F172A" stroke="url(#aiGrad)" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text y="4" text-anchor="middle" fill="#C4B5FD" font-family="'SF Mono', monospace" font-size="11" font-weight="600">LLMs</text>
  </g>
  
  <g transform="translate(450, 70)">
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0F172A" stroke="url(#aiGrad)" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text y="4" text-anchor="middle" fill="#C4B5FD" font-family="'SF Mono', monospace" font-size="11" font-weight="600">RAG</text>
  </g>
  
  <g transform="translate(650, 100)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#0F172A" stroke="url(#aiGrad)" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text y="4" text-anchor="middle" fill="#C4B5FD" font-family="'SF Mono', monospace" font-size="11" font-weight="600">LangChain</text>
  </g>
  
  <!-- AI Label -->
  <text x="450" y="30" text-anchor="middle" fill="#A78BFA" font-family="'SF Mono', monospace" font-size="10" letter-spacing="4" font-weight="600" opacity="0.6">NEURAL AI</text>

  <!-- ============ BACKEND CLUSTER ============ -->
  <g transform="translate(180, 200)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#0F172A" stroke="url(#beGrad)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" fill="#6EE7B7" font-family="'SF Mono', monospace" font-size="11" font-weight="600">FastAPI</text>
  </g>
  
  <g transform="translate(180, 270)">
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0F172A" stroke="url(#beGrad)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" fill="#6EE7B7" font-family="'SF Mono', monospace" font-size="11" font-weight="600">Python</text>
  </g>

  <!-- ============ FRONTEND CLUSTER ============ -->
  <g transform="translate(720, 200)">
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0F172A" stroke="url(#feGrad)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" fill="#FCD34D" font-family="'SF Mono', monospace" font-size="11" font-weight="600">React</text>
  </g>
  
  <g transform="translate(720, 270)">
    <rect x="-48" y="-16" width="96" height="32" rx="16" fill="#0F172A" stroke="url(#feGrad)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" fill="#FCD34D" font-family="'SF Mono', monospace" font-size="11" font-weight="600">JavaScript</text>
  </g>

  <!-- ============ DATA CLUSTER ============ -->
  <g transform="translate(300, 380)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#0F172A" stroke="url(#dbGrad)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" fill="#7DD3FC" font-family="'SF Mono', monospace" font-size="11" font-weight="600">PostgreSQL</text>
  </g>
  
  <g transform="translate(450, 390)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#0F172A" stroke="url(#dbGrad)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" fill="#7DD3FC" font-family="'SF Mono', monospace" font-size="11" font-weight="600">Vector DB</text>
  </g>

  <!-- ============ TOOLS CLUSTER ============ -->
  <g transform="translate(600, 380)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#0F172A" stroke="url(#toolsGrad)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" fill="#CBD5E1" font-family="'SF Mono', monospace" font-size="11" font-weight="600">Git · Linux</text>
  </g>

  <!-- ============ SECONDARY AI NODES ============ -->
  <g transform="translate(340, 145)" opacity="0.8">
    <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
    <text y="3" text-anchor="middle" fill="#A78BFA" font-family="'SF Mono', monospace" font-size="9">PyTorch</text>
  </g>
  <g transform="translate(560, 145)" opacity="0.8">
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
    <text y="3" text-anchor="middle" fill="#A78BFA" font-family="'SF Mono', monospace" font-size="9">HuggingFace</text>
  </g>

  <!-- Connect secondary nodes -->
  <g stroke="#8B5CF6" stroke-width="1" opacity="0.3" stroke-dasharray="2,2">
    <line x1="250" y1="100" x2="340" y2="145"/>
    <line x1="450" y1="70" x2="340" y2="145"/>
    <line x1="450" y1="70" x2="560" y2="145"/>
    <line x1="650" y1="100" x2="560" y2="145"/>
  </g>
  
  <!-- Mini particles to secondary nodes -->
  <circle r="2" fill="#C4B5FD" opacity="0.6">
    <animateMotion dur="4s" repeatCount="indefinite" path="M450,70 L340,145"/>
  </circle>
  <circle r="2" fill="#C4B5FD" opacity="0.6">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M450,70 L560,145"/>
  </circle>
</svg>
